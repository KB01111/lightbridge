<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightBridge</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: transparent;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (forced-colors: active) {
        html[data-surface='main'],
        html[data-surface='main'] body,
        html[data-surface='main'] #root,
        html[data-surface='settings'],
        html[data-surface='settings'] body,
        html[data-surface='settings'] #root {
          background: Canvas;
          color: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
